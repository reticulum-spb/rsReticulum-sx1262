interfaces:
  - type: plugin
    name: Linux LoRa
    plugin: sx1262
    mtu: 500
    config:
      device: /dev/lora0
      frequency: 868000000
      bandwidth: 125000
      spreading_factor: 7
      coding_rate: 5
      tx_power: 22
      rx_preamble_symbols: 65
      tx_preamble_symbols: 25
      sync_word: 5156 # 0x1424
      tx_timeout_seconds: 120
      irq_watchdog_seconds: 60
      hard_reset_after: 2
