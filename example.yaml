interfaces:
  - type: plugin
    name: SPI LoRa
    plugin: sx1262
    mtu: 500
    config:
      spi: /dev/spidev1.0
      cs:    { port: 0, pin: 13 }
      rst:   { port: 0, pin: 6 }
      busy:  { port: 0, pin: 11 }
      dio1:  { port: 0, pin: 12 }
      rx_en: { port: 0, pin: 2 }
      tx_en: { port: 0, pin: 18 }
      frequency: 868000000
      bandwidth: 125000
      spreading_factor: 7
      coding_rate: 5
      tx_power: 22
      preamble_symbols: 25
      sync_word: 5156 # 0x1424
      tcxo_voltage: 1.8
